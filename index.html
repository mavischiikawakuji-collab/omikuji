<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{overflow-x:clip}
body{margin:0;background:#F5F1E9;color:#3D2B1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC",serif;min-height:100vh;padding:0 0 40px;overflow-x:clip;transition:background .6s}
.wrap{padding:0 16px;position:relative}
.header{display:flex;justify-content:space-between;padding:20px 0 14px}
.h1{font-size:28px;font-weight:900;letter-spacing:1px} .h1 small{display:block;font-size:11px;color:#C53030;letter-spacing:3px;margin-top:4px}
.illust{width:68px;height:68px;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(197,48,48,.18);background:#FFF;display:grid;place-items:center;font-size:28px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.stat{background:rgba(255,255,255,.85);border:1px solid #E8DDD0;border-radius:18px;padding:14px} .stat b{font-size:20px;display:block} .stat i{font-style:normal;font-size:11px;color:#8B7D6B}
.card{background:rgba(255,255,255,.92);border:1px solid #E8DDD0;border-radius:22px;padding:22px;box-shadow:0 4px 20px rgba(61,43,31,.06);text-align:center;min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.omikuji{font-size:68px;font-weight:900;letter-spacing:8px;margin:10px 0;position:relative;z-index:2;transition:transform .3s}
.omikuji.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.omikuji.unfold{animation:unfold .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes unfold{0%{transform:scale(0.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

.lucky{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:2;position:relative}
.tag{padding:6px 12px;border-radius:99px;font-size:11px;background:#F5F1E9;border:1px solid #E8DDD0;color:#8B7D6B}
.sentence{margin-top:18px;font-size:15px;line-height:1.7;color:#5A4635;background:#F5F1E9;border:1px dashed #E8DDD0;border-radius:14px;padding:14px;z-index:2;position:relative;opacity:0;transform:translateY(10px);transition:all .6s}
.sentence.show{opacity:1;transform:translateY(0)}
.btn{width:100%;margin-top:18px;background:#3D2B1F;color:#F5F1E9;font-weight:700;border:0;border-radius:14px;padding:14px;font-size:15px;letter-spacing:1px;box-shadow:0 6px 18px rgba(61,43,31,.18)}
.btn:disabled{opacity:.4}
.btn2{background:#FFF;color:#3D2B1F;border:1px solid #E8DDD0}
.btnBurn{background:#1A202C;color:#FFF;border:1px solid #2D3748}
.gold{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.gold i{position:absolute;width:4px;height:4px;background:radial-gradient(circle,#FFD700,#D4AF37);border-radius:50%;animation:goldFall linear infinite;opacity:0}
@keyframes goldFall{0%{transform:translateY(-20px) translateX(0) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(400px) translateX(40px) scale(1.2);opacity:0}}
.petal{position:absolute;pointer-events:none;z-index:1;font-size:12px;animation:petalFall linear forwards}
@keyframes petalFall{0%{transform:translateY(-20px) rotate(0) translateX(0);opacity:1}100%{transform:translateY(380px) rotate(720deg) translateX(50px);opacity:0}}
.card.burn{animation:burn .9s forwards}
@keyframes burn{0%{filter:brightness(1)}30%{filter:brightness(1.4) contrast(1.2)}60%{background:#2D2D2D;filter:brightness(0.6)}100%{background:#1A1A1A;transform:scale(0.95) rotate(2deg);opacity:0.2;filter:blur(2px)}}
.ash{position:absolute;inset:0;display:none;place-items:center;font-size:14px;color:#8B7D6B;z-index:4}
.ash.show{display:grid}
.history{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.hitem{background:#FFF;border:1px solid #E8DDD0;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.footer{margin-top:24px;text-align:center;color:#8B7D6B;font-size:11px;background:rgba(255,255,255,.7);border:1px solid #E8DDD0;border-radius:14px;padding:12px}
.tbtn{font-size:11px;padding:6px 12px;border-radius:99px;border:1px solid #E8DDD0;background:#FFF;color:#8B7D6B}
.dot{width:8px;height:8px;border-radius:50%;background:#E8DDD0;display:inline-block;margin-right:4px}

<script>
const KEY='omikuji_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"history":[],"lastDate":null,"streak":0}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('last').textContent='最後儲存: '+new Date().toLocaleTimeString();}
setInterval(save,300);
document.addEventListener('gesturestart',function(e){e.preventDefault();});
const $=function(id){return document.getElementById(id);};
const fortunes=[
  {name:'大吉', color:'#C53030', bg:'#FFF5F5', lucky:'紅色 · 珍珠奶茶'},
  {name:'中吉', color:'#2B6CB0', bg:'#F0F7FF', lucky:'藍色 · 貓'},
  {name:'小吉', color:'#2F855A', bg:'#F0FFF4', lucky:'綠色 · 薄荷糖'},
  {name:'吉', color:'#744210', bg:'#FFFAF0', lucky:'米色 · 麵包'},
  {name:'末吉', color:'#6B46C1', bg:'#FAF5FF', lucky:'紫色 · 雨傘'},
  {name:'凶', color:'#1A202C', bg:'#F7FAFC', lucky:'黑色 · 咖啡'},
];
function todayStr(){return new Date().toISOString().slice(0,10);}
function render(){
  $('count').textContent=data.history.length+' 籤';
  $('streak').textContent=data.streak+' 日';
  const today = todayStr();
  const todayItem = data.history.find(function(h){return h.date===today;});
  const burnBtn=$('burnBtn');
  if(todayItem){
    showFortune(todayItem.fortuneObj, todayItem.sentence, false);
    $('draw').disabled=true;
    $('draw').textContent='今日已抽 · '+todayItem.fortuneObj.name;
    $('redraw').style.display='block';
    if(todayItem.fortuneObj.name==='凶'){
      burnBtn.style.display='block';
      burnBtn.disabled=false;
      burnBtn.textContent='🔥 燒掉轉運（凶籤限定）';
    } else {
      burnBtn.style.display='none';
    }
  } else {
    $('draw').disabled=false;
    $('draw').textContent='🎋 抽一支籤';
    $('redraw').style.display='none';
    burnBtn.style.display='none';
    if(!$('card').classList.contains('burn')){
      $('fortune').textContent='未抽';
      $('fortune').style.color='#3D2B1F';
      $('lucky').innerHTML='';
      $('sentence').textContent='撳下面支籤，睇下今日係大吉定係要小心啲';
      $('sentence').classList.remove('show');
      document.getElementById('body').style.background='#F5F1E9';
      $('gold').innerHTML='';
      $('ash').classList.remove('show');
      $('card').classList.remove('burn');
    }
  }
  const hist=$('history');hist.innerHTML='';
  const rev=[...data.history].reverse().slice(0,10);
  rev.forEach(function(h){
    const d=document.createElement('div');d.className='hitem';
    d.innerHTML='<span><span class="dot" style="background:'+h.fortuneObj.color+'"></span>'+h.date+' · '+h.fortuneObj.name+'</span><span style="color:#8B7D6B;font-size:11px">'+h.fortuneObj.lucky.split('·')[0]+'</span>';
    hist.appendChild(d);
  });
}
function createGold(){
  const gold=$('gold');gold.innerHTML='';
  for(let i=0;i<18;i++){
    const el=document.createElement('i');
    el.style.left=Math.random()*100+'%';
    el.style.top=-10-Math.random()*100+'px';
    el.style.animationDuration=(3+Math.random()*4)+'s';
    el.style.animationDelay=(Math.random()*2)+'s';
    gold.appendChild(el);
  }
}
function createPetals(type){
  const card=$('card');
  const symbols={ '大吉':'🌸', '中吉':'💧', '小吉':'🍃', '吉':'✦', '末吉':'☔', '凶':'🍂' };
  const sym=symbols[type]||'✦';
  for(let i=0;i<10;i++){
    setTimeout(function(){
      const p=document.createElement('div');p.className='petal';p.textContent=sym;
      p.style.left=Math.random()*90+'%';p.style.top='-10px';
      p.style.animationDuration=(3+Math.random()*2)+'s';
      card.appendChild(p);
      setTimeout(function(){p.remove();},4000);
    }, i*120);
  }
}
function showFortune(fObj, sentence, animate){
  if(animate===undefined) animate=true;
  const fortuneEl=$('fortune');
  if(animate){
    fortuneEl.classList.remove('shake','unfold');
    void fortuneEl.offsetWidth;
    fortuneEl.classList.add('shake');
    setTimeout(function(){fortuneEl.classList.remove('shake');fortuneEl.classList.add('unfold');},500);
  }
  fortuneEl.textContent=fObj.name;
  fortuneEl.style.color=fObj.color;
  $('lucky').innerHTML='<span class="tag">幸運色 '+fObj.lucky.split('·')[0]+'</span><span class="tag">'+fObj.lucky.split('·')[1]+'</span>';
  $('sentence').textContent=sentence;
  setTimeout(function(){$('sentence').classList.add('show');}, animate?600:0);
  document.getElementById('body').style.background=fObj.bg;

  if(fObj.name==='大吉'){
    createGold();
  } else {
    $('gold').innerHTML='';
  }
  createPetals(fObj.name);
  if(navigator.vibrate) navigator.vibrate(fObj.name==='凶'?[50,50,50]:[30]);
}
function draw(isRedraw){
  const pick = fortunes[Math.floor(Math.random()*fortunes.length)];
  const sentences={
    '大吉':['今日你講嘢都會大聲啲，記得謙虛。','財運喺奶茶度。','適合表白，但唔好同前度講。'],
    '中吉':['有人會請你食嘢，唔好客氣。','今日適合整理房間。','靈感會喺沖涼嗰陣嚟。'],
    '小吉':['準時食飯已經係勝利。','唔好睇太多負面新聞。','今日首歌會好啱你。'],
    '吉':['普通日，做普通事就好。','記得飲水。','唔好同人爭拗。'],
    '末吉':['出門前check多次鎖匙。','今日唔好網購。','夜晚早啲瞓。'],
    '凶':['今日唔好剪頭髮。','唔好借錢俾人。','適合睇劇耍廢。'],
  };
  const pool=sentences[pick.name];
  const sentence=pool[Math.floor(Math.random()*pool.length)];
  const today=todayStr();
  if(!isRedraw){
    const idx=data.history.findIndex(function(h){return h.date===today;});
    if(idx!==-1) return;
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().slice(0,10);
    if(data.lastDate===yStr) data.streak++; else if(data.lastDate!==today) data.streak=1;
    data.lastDate=today;
    data.history.push({date:today, fortuneObj:pick, sentence:sentence});
  } else {
    const idx=data.history.findIndex(function(h){return h.date===today;});
    if(idx!==-1) data.history[idx]={date:today, fortuneObj:pick, sentence:sentence};
  }
  save();render();
  let i=0;const anim=setInterval(function(){
    $('fortune').textContent=fortunes[i%fortunes.length].name;
    i++;if(i>12){clearInterval(anim);showFortune(pick,sentence,true);}
  },60);
}
$('draw').onclick=function(){draw(false);};
$('redraw').onclick=function(){draw(true);};
$('burnBtn').onclick=function(){
  const card=$('card');
  card.classList.add('burn');
  $('ash').classList.add('show');
  $('gold').innerHTML='';
  const today=todayStr();
  setTimeout(function(){
    const idx=data.history.findIndex(function(h){return h.date===today;});
    if(idx!==-1) data.history.splice(idx,1);
    data.lastDate=null;
    if(data.streak>0) data.streak--;
    save();
    card.classList.remove('burn');
    $('ash').classList.remove('show');
    $('fortune').textContent='已燒掉';
    $('sentence').textContent='灰燼已散，厄運已過，可以重抽一次';
    $('sentence').classList.add('show');
    $('draw').disabled=false;
    $('draw').textContent='🎋 重抽轉運籤';
    $('redraw').style.display='none';
    $('burnBtn').style.display='none';

    document.getElementById('body').style.background='#F5F1E9';
    if(navigator.vibrate) navigator.vibrate([80,40,80]);
  },900);
};
$('export').onclick=function(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='omikuji.json';a.click();URL.revokeObjectURL(u);};
$('import').onclick=function(){$('file').click();};
$('file').onchange=function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(){try{data=JSON.parse(r.result);save();render();}catch{alert('格式唔啱')}};r.readAsText(f);};
$('clear').onclick=function(){if(data.history.length===0)return;data={history:[],lastDate:null,streak:0};save();render();document.getElementById('body').style.background='#F5F1E9';$('gold').innerHTML='';};
render();save();
